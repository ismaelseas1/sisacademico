<div class="login-container">


  <div class="login-form">


    <div class="logo">
      🎓
    </div>


    <h2>
      Sistema Académico
    </h2>


    <p class="subtitle">
      Ingrese sus credenciales para acceder
    </p>



    <label>
      Usuario
    </label>

    <input
      type="text"
      [(ngModel)]="identificador"
      placeholder="Ingrese usuario"
    >



    <label>
      Contraseña
    </label>

    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Ingrese contraseña"
    >



    <button
      class="btn-login"
      (click)="ingresar()">

      Ingresar

    </button>



  </div>


</div>
