; Ajustes de produccion para la API.
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 60
expose_php = Off

; El codigo no cambia dentro del contenedor, por lo que conviene
; desactivar la revalidacion de archivos.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
