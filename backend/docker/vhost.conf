# El puerto real lo sustituye entrypoint.sh a partir de la variable PORT,
# porque las plataformas de despliegue lo asignan dinamicamente.
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Registra la IP real del cliente cuando hay un proxy delante.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
